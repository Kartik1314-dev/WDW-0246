<html>
    <head>
        <title> Document </title>
    </head>
    <body>
        <h1 align="center"> Hotel Booking Form </h1>
        <form  action ="#" align="center">

            <label for = "Full Name"> Full Name: </label>
            <input type="text" name="Full Name" id="Full Name">
            <br><br>

            <label for = "Email"> Email: </label>
            <input type="email" name="Email" id="Email">
            <br><br>

            <label for = "Phone "> Phone: </label>
            <input type="tel" name="Phone" id="Phone">
            <br><br>

            <label for = "CheckIn"> Check In Date: </label>
            <input type="date" name="CheckIn" id="CheckIn">
            <br><br>

            <label for = "CheckOut"> Check Out Date: </label>
            <input type="date" name="CheckOut" id="CheckOut">
            <br><br>

             <label for = "Room Type"> Room Type: </label>
            <select name="Room Type" id="Room Type">
                <option value="Single"> Single </option>
                <option value="Double"> Double </option>
                <option value="Luxury"> Luxury </option>
            </select>
            <br><br>

            <label for = "Guest"> No. of Guests: </label>
            <input type="number" name="Guest" id="Guest" min="1" max="10">
            <br><br>

            <lable for = "Special Requests"> Special Requests: </label> <br><br>
            <textarea name="Special Requests" id="Special Requests" rows="4" cols="50"></textarea>
            <br><br>

            <input type="Submit" value="Book Now">
            <input type="Reset" value="Reset">

            </form>
        </body>
</html>
